# ---------------------------------------------------------------------------
# TESTING ke liye plain Secret hai (values yahin file mein readable hain).
# Production mein iski jagah External Secrets Operator / Sealed Secrets /
# AWS Secrets Manager CSI driver use karna, aur ye file git mein commit
# NAHI karni (isay .gitignore mein add kar lena).
#
# Values kahan se aayenge:
#   terraform output rds_address    -> DB_HOST
#   terraform output rds_endpoint   -> host:port dono (reference ke liye)
#   terraform.tfvars ka db_password -> DB_PASSWORD
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: laravel-shop-secret
  namespace: laravel-shop
type: Opaque
stringData:
  APP_NAME: "Mini Shop"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://CHANGE-ME-load-balancer-or-domain"
  APP_KEY: "base64:HgxKxn9AXa20GpARwcxA5vxxmo3HMtNtFvR+tgMrvaY="

  DB_CONNECTION: "mysql"
  DB_HOST: "CHANGE-ME.xxxxxxxxxx.ap-south-1.rds.amazonaws.com"   # terraform output rds_address
  DB_PORT: "3306"
  DB_DATABASE: "ecommerce"                                       # terraform var.db_name
  DB_USERNAME: "ecommerce_admin"                                  # terraform var.db_username
  DB_PASSWORD: "kX9#mP2!vF7$tQ5*wN"

  SESSION_DRIVER: "file"
  SESSION_LIFETIME: "120"
  CACHE_STORE: "file"
  QUEUE_CONNECTION: "sync"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "warning"
