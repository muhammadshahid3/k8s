apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: laravel-shop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/muhammadshahid3/k8s.git
    targetRevision: main          # branch ka naam confirm kar lena (main/master)
    path: k8s                     # manifests is subfolder ke andar hain

  destination:
    server: https://kubernetes.default.svc
    namespace: laravel-shop

  syncPolicy:
    automated:
      prune: true       # Git se hataya gaya resource cluster se bhi hat jayega
      selfHeal: true     # kisi ne kubectl se manual change kiya to ArgoCD wapis Git state pe le aayega
    syncOptions:
      - CreateNamespace=true
